# ---------------------------------------------------------------
# Môi trường hiện tại: 1 server <hostname> chạy tất cả
# ---------------------------------------------------------------
[zookeeper]
<hostname> ansible_host=<IP>

[hbase_master]
<hostname> ansible_host=<IP>

[hbase_regionserver]
<hostname> ansible_host=<IP>

[hbase:children]
hbase_master
hbase_regionserver

[all:vars]
ansible_user=ubuntu
ansible_port=22

# ---------------------------------------------------------------
# Mẫu cho cụm nhiều node theo Service.docx (bỏ dấu # và sửa IP)
# ---------------------------------------------------------------
# [zookeeper]
# journalnode01 ansible_host=10.0.0.11
# journalnode02 ansible_host=10.0.0.12
# journalnode03 ansible_host=10.0.0.13
#
# [hbase_master]
# hm02 ansible_host=10.0.0.22    # máy đầu tiên = Active, các máy sau = Backup
# hm01 ansible_host=10.0.0.21
#
# [hbase_regionserver]
# rs01 ansible_host=10.0.0.31
# rs02 ansible_host=10.0.0.32
# rs03 ansible_host=10.0.0.33
# rs04 ansible_host=10.0.0.34
# rs05 ansible_host=10.0.0.35
# rs06 ansible_host=10.0.0.36
#
# [hbase:children]
# hbase_master
# hbase_regionserver
